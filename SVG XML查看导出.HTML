<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SVG XML查看导出</title>
	<style>
		:root {
			--bg: #1a1a1e;
			--panel-bg: #27272d;
			--input-bg: #121216;
			--border: #383842;
			--accent: #f28abf;
			--accent-hover: #e070a8;
			--accent-dim: #a05a80;
			--text: #eee;
			--text-dim: #aaa;
			--text-faint: #777;
			--error: #f87171;
			--warning: #fbbf24;
			--success: #4ade80;
			--success-bg: rgba(74, 222, 128, 0.15);
			--danger-bg: rgba(248, 113, 113, 0.15);
			--warning-bg: rgba(251, 191, 36, 0.12);
			--info-bg: rgba(242, 138, 191, 0.12);
			--radius: 12px;
			--radius-sm: 6px;
			--shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
			--transition: 0.2s ease;
			--mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace;
			--sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
		}
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			background-color: var(--bg);
			color: var(--text);
			font-family: var(--sans);
			min-height: 100vh;
			padding: 16px;
			display: flex;
			justify-content: center;
			align-items: flex-start;
		}
		.container {
			width: 100%;
			max-width: 1280px;
			display: flex;
			flex-direction: column;
			gap: 14px;
		}
		.header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			flex-wrap: wrap;
			gap: 10px;
			padding: 0 4px;
		}
		.header h1 {
			font-size: 1.3rem;
			font-weight: 700;
			letter-spacing: -0.3px;
			color: var(--accent);
		}
		.header .badge {
			font-size: 0.7rem;
			font-weight: 600;
			background: var(--info-bg);
			color: var(--accent);
			padding: 4px 10px;
			border-radius: 20px;
			letter-spacing: 0.5px;
			text-transform: uppercase;
		}
		.toast {
			position: fixed;
			top: 20px;
			right: 20px;
			z-index: 1000;
			padding: 12px 20px;
			border-radius: var(--radius-sm);
			font-size: 0.88rem;
			font-weight: 500;
			opacity: 0;
			transform: translateY(-10px);
			pointer-events: none;
			transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
			box-shadow: var(--shadow);
			max-width: 380px;
		}
		.toast.show {
			opacity: 1;
			transform: translateY(0);
			pointer-events: auto;
		}
		.toast.success {
			background: var(--success-bg);
			color: var(--success);
			border: 1px solid #4ade80;
		}
		.toast.error {
			background: var(--danger-bg);
			color: var(--error);
			border: 1px solid #f87171;
		}
		.toast.info {
			background: var(--info-bg);
			color: var(--accent);
			border: 1px solid var(--accent-dim);
		}
		.toast.warning {
			background: var(--warning-bg);
			color: var(--warning);
			border: 1px solid #fbbf24;
		}

		.main-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 14px;
			align-items: stretch;
		}
		@media (max-width: 820px) {
			.main-grid {
				grid-template-columns: 1fr;
			}
			body {
				padding: 8px;
			}
		}

		.panel {
			background: var(--panel-bg);
			border-radius: var(--radius);
			padding: 16px;
			display: flex;
			flex-direction: column;
			min-height: 0;
			box-shadow: var(--shadow);
			border: 1px solid var(--border);
		}
		.panel-title {
			font-size: 0.75rem;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.6px;
			color: var(--accent);
			margin-bottom: 10px;
			flex-shrink: 0;
			text-align: center;
		}

		.drop-zone {
			border: 2px dashed var(--border);
			border-radius: var(--radius-sm);
			padding: 14px;
			text-align: center;
			cursor: pointer;
			transition: all var(--transition);
			background: var(--input-bg);
			margin-bottom: 10px;
			user-select: none;
			position: relative;
			flex-shrink: 0;
		}
		.drop-zone:hover,
		.drop-zone.dragover {
			border-color: var(--accent);
			background: rgba(242, 138, 191, 0.08);
		}
		.drop-zone p {
			font-size: 0.82rem;
			color: var(--text-dim);
			pointer-events: none;
		}
		.drop-zone .hint {
			font-size: 0.7rem;
			color: var(--text-faint);
			margin-top: 3px;
			pointer-events: none;
		}
		.drop-zone input[type="file"] {
			position: absolute;
			inset: 0;
			opacity: 0;
			cursor: pointer;
		}

		#codeInput {
			width: 100%;
			flex: 1;
			min-height: 350px;
			max-height: 550px;
			background: var(--input-bg);
			color: #e9e9ed;
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			padding: 12px;
			font-family: var(--mono);
			font-size: 12.5px;
			line-height: 1.55;
			resize: vertical;
			tab-size: 2;
			white-space: pre;
			overflow: auto;
			outline: none;
			transition: border-color var(--transition);
		}
		#codeInput:focus {
			border-color: var(--accent);
		}

		.btn-group {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
			margin-top: 10px;
			flex-shrink: 0;
		}
		button {
			background: var(--accent);
			color: #000;
			border: none;
			padding: 9px 14px;
			border-radius: var(--radius-sm);
			cursor: pointer;
			font-weight: 700;
			font-size: 0.82rem;
			transition: all var(--transition);
			letter-spacing: 0.2px;
			min-height: 38px;
			min-width: 38px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 4px;
			white-space: nowrap;
			user-select: none;
		}
		button:hover {
			opacity: 0.85;
			transform: translateY(-1px);
		}
		button:active {
			transform: scale(0.96);
		}
		button.secondary {
			background: #3a3a44;
			color: #eee;
		}
		button.secondary:hover {
			background: #4a4a56;
		}
		button.danger {
			background: transparent;
			color: var(--error);
			border: 1.5px solid #f87171;
		}
		button.danger:hover {
			background: var(--danger-bg);
		}
		button.outline {
			background: transparent;
			color: var(--text);
			border: 1.5px solid var(--border);
		}
		button.outline:hover {
			border-color: var(--accent);
			color: var(--accent);
			background: var(--info-bg);
		}
		button:disabled {
			opacity: 0.45;
			cursor: not-allowed;
			transform: none !important;
		}

		.preview-area {
			flex: 1;
			min-height: 350px;
			background: var(--input-bg);
			border-radius: var(--radius-sm);
			padding: 14px;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: auto;
			position: relative;
			border: 1px solid var(--border);
			color-scheme: only light;
		}
		.preview-area canvas {
			max-width: 100%;
			height: auto;
			border-radius: 4px;
			display: block;
			image-rendering: auto;
		}
		.preview-area .placeholder {
			color: var(--text-faint);
			font-size: 0.85rem;
			user-select: none;
			text-align: center;
			padding: 20px;
		}
		.preview-area .error-msg {
			color: var(--error);
			font-size: 0.8rem;
			text-align: center;
			padding: 16px;
			white-space: pre-wrap;
			word-break: break-all;
			max-width: 100%;
		}

		.params-bar {
			display: flex;
			align-items: center;
			gap: 12px;
			flex-wrap: wrap;
			margin-top: 10px;
			flex-shrink: 0;
		}
		.param-group {
			display: flex;
			flex-direction: column;
			gap: 2px;
		}
		.param-group label {
			font-size: 0.65rem;
			font-weight: 700;
			color: var(--text-dim);
			letter-spacing: 0.3px;
			text-transform: uppercase;
		}
		.param-group input[type="number"] {
			padding: 6px 10px;
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			font-size: 0.82rem;
			background: var(--input-bg);
			color: var(--text);
			outline: none;
			transition: border-color var(--transition);
			width: 72px;
			font-family: var(--mono);
		}
		.param-group input[type="number"]:focus {
			border-color: var(--accent);
		}
		.checkbox-group {
			display: flex;
			align-items: center;
			gap: 5px;
			font-size: 0.75rem;
			font-weight: 500;
			cursor: pointer;
			color: var(--text-dim);
			padding-top: 14px;
			user-select: none;
			white-space: nowrap;
		}
		.checkbox-group input[type="checkbox"] {
			width: 15px;
			height: 15px;
			accent-color: var(--accent);
			cursor: pointer;
		}
		.spacer {
			flex: 1;
		}

		.file-info {
			font-size: 0.72rem;
			color: var(--text-dim);
			margin-top: 8px;
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			align-items: center;
			flex-shrink: 0;
			font-family: var(--mono);
		}
		.file-info .tag {
			background: rgba(255, 255, 255, 0.05);
			padding: 3px 9px;
			border-radius: 14px;
			font-weight: 500;
			font-size: 0.7rem;
			color: var(--text-dim);
		}
		.file-info .tag.warning {
			color: var(--warning);
			background: var(--warning-bg);
		}

		.stats-bar {
			margin-top: 8px;
			font-size: 0.72rem;
			color: var(--text-dim);
			text-align: center;
			flex-shrink: 0;
		}
		.stats-bar .warning {
			color: var(--warning);
		}

		.warnings-panel {
			margin-top: 6px;
			background: rgba(0, 0, 0, 0.25);
			border-radius: var(--radius-sm);
			overflow: hidden;
			flex-shrink: 0;
		}
		.warnings-toggle {
			background: transparent;
			color: var(--warning);
			border: none;
			padding: 6px 10px;
			font-size: 0.72rem;
			cursor: pointer;
			width: 100%;
			text-align: left;
			display: flex;
			align-items: center;
			gap: 6px;
			min-height: auto;
			font-weight: 600;
		}
		.warnings-toggle:hover {
			text-decoration: underline;
		}
		.warnings-list {
			max-height: 100px;
			overflow-y: auto;
			padding: 0 10px 6px;
			font-size: 0.68rem;
			color: var(--warning);
			line-height: 1.5;
			font-family: var(--mono);
		}
		.warnings-list div {
			padding: 2px 0;
			border-bottom: 1px solid rgba(255, 255, 255, 0.05);
		}

		@media (max-width: 600px) {
			.container {
				padding: 4px;
				gap: 10px;
			}
			.panel {
				padding: 10px;
			}
			#codeInput {
				min-height: 220px;
				font-size: 11px;
			}
			.params-bar {
				gap: 6px;
			}
			.param-group input[type="number"] {
				width: 58px;
				font-size: 0.72rem;
				padding: 5px 7px;
			}
			button {
				padding: 7px 10px;
				font-size: 0.72rem;
				min-height: 32px;
			}
			.preview-area {
				min-height: 220px;
			}
		}
	</style>
</head>
<body>

	<div id="toast" class="toast"></div>

	<div class="container">
		<div class="header">
			<h1>SVG XML查看导出</h1>
			<span class="badge">100%离线</span>
		</div>

		<div class="main-grid">
			<div class="panel">
				<div class="panel-title">输入区</div>
				<div class="drop-zone" id="dropZone">
					<p>拖拽 .svg 或 .xml 文件到这里，或点击上传</p>
					<p class="hint">支持 SVG / Vector / Layer-list / Icon 格式</p>
					<input type="file" id="fileInput" accept=".svg,.xml,image/svg+xml,text/xml,application/xml">
				</div>
				<textarea id="codeInput" placeholder="在此粘贴 SVG、Vector、Layer-list 或 Icon 代码" spellcheck="false"></textarea>
				<div class="btn-group" style="justify-content:center;">
					<button id="btnRender" title="手动渲染">渲染</button>
					<button class="secondary" id="btnXmlSample" title="加载 XML 示例">XML示例</button>
					<button class="secondary" id="btnSvgSample" title="加载 SVG 示例">SVG示例</button>
					<button class="danger" id="btnClear" title="清空输入">清空</button>
					<button class="outline" id="btnCopy" title="复制输入代码">复制</button>
				</div>
				<div class="stats-bar" id="statsBar"></div>
				<div class="warnings-panel" id="warningsPanel" style="display:none;">
					<button class="warnings-toggle" id="warningsToggle">显示警告 (0)</button>
					<div class="warnings-list" id="warningsList"></div>
				</div>
			</div>

			<div class="panel">
				<div class="panel-title">预览 & 导出</div>
				<div class="preview-area" id="previewArea">
					<span class="placeholder">等待渲染...</span>
				</div>
				<div class="file-info" id="fileInfo">
					<span class="tag">原始: 待检测</span>
					<span class="tag">输出: 待渲染</span>
					<span class="tag">大小: —</span>
				</div>
				<div class="params-bar">
					<div class="param-group">
						<label>宽度</label>
						<input id="wInput" type="number" value="512" min="1" max="10000" step="1">
					</div>
					<div class="param-group">
						<label>高度</label>
						<input id="hInput" type="number" value="512" min="1" max="10000" step="1">
					</div>
					<div class="param-group">
						<label>倍率</label>
						<input id="scaleInput" type="number" value="1" min="0.1" max="8" step="0.1">
					</div>
					<label class="checkbox-group">
						<input type="checkbox" id="autoSize" checked>
						自动尺寸
					</label>
					<div class="spacer"></div>
					<button id="btnTogglePreview" class="secondary" title="切换预览模式">矢量</button>
					<button id="btnDownload" disabled style="background:var(--success);color:#000;">下载 PNG</button>
				</div>
			</div>
		</div>
	</div>

	<script>
		(function() {
			'use strict';

			const NS = 'http://schemas.android.com/apk/res/android';
			const FBC = '#FF00FF';
			const MAXD = 8192;
			const DBD = 500;

			const cInp = document.getElementById('codeInput');
			const pvEl = document.getElementById('previewArea');
			const wInp = document.getElementById('wInput');
			const hInp = document.getElementById('hInput');
			const sInp = document.getElementById('scaleInput');
			const aChk = document.getElementById('autoSize');
			const fInfo = document.getElementById('fileInfo');
			const sBar = document.getElementById('statsBar');
			const bRen = document.getElementById('btnRender');
			const bDl = document.getElementById('btnDownload');
			const bCp = document.getElementById('btnCopy');
			const bClr = document.getElementById('btnClear');
			const bXml = document.getElementById('btnXmlSample');
			const bSvg = document.getElementById('btnSvgSample');
			const dZone = document.getElementById('dropZone');
			const fInp = document.getElementById('fileInput');
			const toastEl = document.getElementById('toast');
			const wPnl = document.getElementById('warningsPanel');
			const wTgl = document.getElementById('warningsToggle');
			const wLst = document.getElementById('warningsList');
			const bTgl = document.getElementById('btnTogglePreview');

			let warns = [];
			let pngB = null;
			let rw = 0;
			let rh = 0;
			let dw = 0;
			let dh = 0;
			let fmt = '';
			let tT = null;
			let dT = null;
			let busy = false;
			let pm = 'vector';
			let autoSet = false;

			function toast(msg, type = 'info') {
				toastEl.textContent = msg;
				toastEl.className = 'toast ' + type;
				void toastEl.offsetWidth;
				toastEl.classList.add('show');
				clearTimeout(tT);
				tT = setTimeout(() => toastEl.classList.remove('show'), 3000);
			}

			function db(fn, delay) {
				let timer = null;
				return function(...args) {
					clearTimeout(timer);
					timer = setTimeout(() => fn.apply(this, args), delay);
				};
			}

			function cl(v, mn, mx) { return Math.min(Math.max(v, mn), mx); }

			function esc(str) {
				return String(str).replace(/[&<>"']/g, function(m) {
					if (m === '&') return '&amp;';
					if (m === '<') return '&lt;';
					if (m === '>') return '&gt;';
					if (m === '"') return '&quot;';
					if (m === "'") return '&#39;';
					return m;
				});
			}
			const escA = esc;

			function fs(bytes) {
				if (bytes === 0) return '0 B';
				const k = 1024;
				const sizes = ['B', 'KB', 'MB'];
				const i = Math.floor(Math.log(bytes) / Math.log(k));
				return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
			}

			function gpe(xmlText) {
				const parser = new DOMParser();
				const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
				const parseError = xmlDoc.querySelector('parsererror');
				if (parseError) {
					const text = parseError.textContent || '';
					const lineMatch = text.match(/line\s*(\d+)/i);
					const colMatch = text.match(/column\s*(\d+)/i);
					let detail = text.trim();
					if (lineMatch || colMatch) {
						detail = `第 ${lineMatch ? lineMatch[1] : '?'} 行${colMatch ? '，第 ' + colMatch[1] + ' 列' : ''}：${detail}`;
					}
					throw new Error('XML语法错误: ' + detail);
				}
				return xmlDoc;
			}

			function gaa(node, attrName) {
				return node.getAttributeNS(NS, attrName) ||
					node.getAttribute('android:' + attrName) ||
					null;
			}

			const CP = {
				named: {
					'transparent': { r: 0, g: 0, b: 0, a: 0 },
					'white': { r: 255, g: 255, b: 255, a: 1 },
					'black': { r: 0, g: 0, b: 0, a: 1 },
					'red': { r: 255, g: 0, b: 0, a: 1 },
					'green': { r: 0, g: 128, b: 0, a: 1 },
					'blue': { r: 0, g: 0, b: 255, a: 1 },
					'yellow': { r: 255, g: 255, b: 0, a: 1 },
					'cyan': { r: 0, g: 255, b: 255, a: 1 },
					'magenta': { r: 255, g: 0, b: 255, a: 1 },
					'gray': { r: 128, g: 128, b: 128, a: 1 },
					'grey': { r: 128, g: 128, b: 128, a: 1 },
					'silver': { r: 192, g: 192, b: 192, a: 1 },
					'maroon': { r: 128, g: 0, b: 0, a: 1 },
					'olive': { r: 128, g: 128, b: 0, a: 1 },
					'lime': { r: 0, g: 255, b: 0, a: 1 },
					'aqua': { r: 0, g: 255, b: 255, a: 1 },
					'teal': { r: 0, g: 128, b: 128, a: 1 },
					'navy': { r: 0, g: 0, b: 128, a: 1 },
					'fuchsia': { r: 255, g: 0, b: 255, a: 1 },
					'purple': { r: 128, g: 0, b: 128, a: 1 },
					'orange': { r: 255, g: 165, b: 0, a: 1 },
					'pink': { r: 255, g: 192, b: 203, a: 1 },
					'brown': { r: 165, g: 42, b: 42, a: 1 },
					'gold': { r: 255, g: 215, b: 0, a: 1 },
					'coral': { r: 255, g: 127, b: 80, a: 1 },
					'salmon': { r: 250, g: 128, b: 114, a: 1 },
					'khaki': { r: 240, g: 230, b: 140, a: 1 },
					'violet': { r: 238, g: 130, b: 238, a: 1 },
					'indigo': { r: 75, g: 0, b: 130, a: 1 },
					'turquoise': { r: 64, g: 224, b: 208, a: 1 },
					'plum': { r: 221, g: 160, b: 221, a: 1 },
					'crimson': { r: 220, g: 20, b: 60, a: 1 },
					'chocolate': { r: 210, g: 105, b: 30, a: 1 },
					'tan': { r: 210, g: 180, b: 140, a: 1 },

			function rf(file) {
				if (!file) return;
				const ext = file.name.toLowerCase().split('.').pop();
				if (!['svg', 'xml'].includes(ext) && !['image/svg+xml', 'text/xml', 'application/xml'].includes(file
						.type)) {
					toast('请上传 .svg 或 .xml 文件', 'error');
					return;
				}
				const reader = new FileReader();
				reader.onload = function(e) {
					cInp.value = e.target.result;
					toast('文件已加载', 'success');
					dbR();
				};
				reader.onerror = function() { toast('文件读取失败', 'error'); };
				reader.readAsText(file);
			}

			bRen.addEventListener('click', () => { clearTimeout(dT);
				render(); });
			bDl.addEventListener('click', dl);
			bTgl.addEventListener('click', function() {
				if (pm === 'vector') {
					pm = 'bitmap';
					bTgl.textContent = '位图';
				} else {
					pm = 'vector';
					bTgl.textContent = '矢量';
				}
				if (cInp.value.trim()) render();
			});
			bCp.addEventListener('click', cp);
			bClr.addEventListener('click', clr);
			bXml.addEventListener('click', lxml);
			bSvg.addEventListener('click', lsvg);

			cInp.addEventListener('input', dbR);
			cInp.addEventListener('keydown', (e) => {
				if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
					e.preventDefault();
					clearTimeout(dT);
					render();
				}
			});

			[wInp, hInp, sInp].forEach(el => {
				el.addEventListener('input', dbR);
				el.addEventListener('change', dbR);
			});

			[wInp, hInp].forEach(el => {
				el.addEventListener('input', () => {
					if (!autoSet && aChk.checked) {
						aChk.checked = false;
					}
				});
			});

			aChk.addEventListener('change', dbR);

			dZone.addEventListener('dragover', (e) => { e.preventDefault();
				dZone.classList.add('dragover'); });
			dZone.addEventListener('dragleave', (e) => { e.preventDefault();
				dZone.classList.remove('dragover'); });
			dZone.addEventListener('drop', (e) => {
				e.preventDefault();
				dZone.classList.remove('dragover');
				if (e.dataTransfer.files.length > 0) rf(e.dataTransfer.files[0]);
			});
			fInp.addEventListener('change', () => {
				if (fInp.files.length > 0) { rf(fInp.files[0]);
					fInp.value = ''; }
			});

			pvEl.addEventListener('click', (e) => {
				if (e.target === e.currentTarget || e.target.classList.contains('placeholder')) cInp.focus();
			});

			function init() {
				ufi(0, 0, 0, 0, null);
				uwp();
				lsvg();
				toast('工具已就绪，支持 SVG / Vector / Layer-list / Icon', 'info');
			}
			init();
		})();
